<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>原会话同步验证器 · 不要再做 App 了</title><link rel="stylesheet" href="/verifier.css"></head>
<body><main><header><span class="eyebrow">不要再做 App 了 / 开发验证</span><h1>同一段对话，两个窗口。</h1><p>这里连接启动它的原 Agent 任务。当前是同步验证器，尚未宣称正式兼容。</p></header><section class="status"><strong id="status">正在核对连接…</strong><code id="thread"></code><button id="reconnect">重新连接并核对</button><button id="export">导出脱敏检测记录</button></section><section class="workspace"><section class="conversation"><h2>原会话中的消息 <small id="count"></small></h2><div id="messages"></div></section><aside><h2>发送到原 Agent</h2><p>这会真实向原会话提交消息。验收时还需确认原窗口显示，不能只看接口成功。</p><form id="send-form"><textarea id="input" aria-label="发送到原 Agent 的消息" placeholder="输入一句话，验证它是否出现在原会话中" rows="8"></textarea><div class="compose-footer"><small id="draft-state">草稿自动保存</small><button type="submit" id="send">发送</button></div></form><p id="notice" role="status"></p><button id="review-latest" hidden>阅读最新消息后，保留草稿继续</button><h2>提交核对</h2><div id="submissions"></div><p class="footnote">仅收录原用户输入与最终回复；排除思考、过程和其他工具输出。接口成功不等于完整兼容，实际结果按宿主分别记录。</p></aside></section></main><script type="module" src="/verifier.js"></script></body></html>
